<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學科試卷擬題系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) for Excel Import/Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* 強制頁面為 100% 視窗高度且禁止原生滾動，改用內部容器滾動 */
        body, html { height: 100%; overflow: hidden; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        #root { height: 100%; }
        
        /* 提示框動畫 */
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideDown 0.3s ease-out forwards; }
        
        /* 自訂美化捲軸 (右側儀表板使用) */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 預設示範資料 (模擬 Excel 匯入的結構)
        const defaultCurriculum = [
            { grade: '小五', book: '5上A', topic: '1. 多位數', domain: '數', objective: '認識過萬的數，包括十萬、百萬、千萬。' },
            { grade: '小五', book: '5上A', topic: '1. 多位數', domain: '數', objective: '讀出和寫出過萬的數。' },
            { grade: '小五', book: '5上A', topic: '2. 乘法', domain: '數', objective: '計算三個數的連乘。' },
            { grade: '小五', book: '5上A', topic: '3. 分數的認識', domain: '數', objective: '認識真分數、假分數和帶分數。' },
            { grade: '小五', book: '5上B', topic: '10. 面積', domain: '度量', objective: '計算三角形的面積。' },
            { grade: '小五', book: '5上B', topic: '10. 面積', domain: '度量', objective: '計算平行四邊形的面積。' },
            { grade: '小四', book: '4下A', topic: '1. 四則混合計算', domain: '數', objective: '計算涉及括號的四則混合算式。' }
        ];

        const grades = ['小一', '小二', '小三', '小四', '小五', '小六'];
        const examStages = ['考一', '考二', '考三'];
        const questionTypes = ['計算題', '選擇題', '短答題', '應用題', '畫圖/數據處理/行程圖/其他'];

        const { useState, useEffect, useMemo, useRef } = React;

        function App() {
            // 資料庫狀態
            const [curriculumDB, setCurriculumDB] = useState(defaultCurriculum);
            
            // 第一部份：基本資料
            const [basicInfo, setBasicInfo] = useState({
                year: '2026-2027',
                schoolName: '',
                targetGrade: '小五',
                examStage: '考一',
                subjectTeacher: '',
                setter: ''
            });

            // 第二部份：考核範圍
            const [examScopes, setExamScopes] = useState([]);
            const [currentScopeParams, setCurrentScopeParams] = useState({ grade: '小五', book: '' });
            const [selectedTopics, setSelectedTopics] = useState([]); // 多選課題

            // 第三部份：擬題表
            const [questions, setQuestions] = useState([]);
            const [currentQuestionParams, setCurrentQuestionParams] = useState({
                grade: '', book: '', topic: '', objective: '', 
                domain: '數', qNum: '', type: '計算題', high: '否', score: ''
            });

            // 新增：用於追蹤編輯狀態的變數
            const [editingQuestionId, setEditingQuestionId] = useState(null);
            const [editFormData, setEditFormData] = useState({ qNum: '', type: '', high: '', score: '' });

            // 系統提示狀態
            const [toastMessage, setToastMessage] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false); // 控制小螢幕時的右側統計面板
            const jsonFileInputRef = useRef(null);

            // 顯示 Toast 訊息
            const showToast = (msg, isError = false) => {
                setToastMessage({ text: msg, isError });
                setTimeout(() => setToastMessage(null), 3000);
            };

            // 匯出 JSON 檔案
            const exportJSON = () => {
                try {
                    const exportData = {
                        version: "1.0",
                        exportDate: new Date().toISOString(),
                        basicInfo,
                        examScopes,
                        questions,
                        curriculumDB
                    };
                    const jsonString = JSON.stringify(exportData, null, 2);
                    const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    const fileName = `擬題進度_${basicInfo.year}_${basicInfo.targetGrade}_${basicInfo.examStage}.json`;
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast("✅ 已成功匯出 JSON 檔案！");
                } catch (e) {
                    showToast("匯出 JSON 失敗，請重試", true);
                }
            };

            // 載入 JSON 檔案
            const handleJSONUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (!parsed.basicInfo && !parsed.questions && !parsed.examScopes) {
                            showToast("⚠️ 檔案格式不符合擬題系統規範", true);
                            return;
                        }

                        setConfirmDialog({
                            title: "確認載入 JSON 進度檔",
                            message: `確定要載入檔案「${file.name}」？目前畫面上未匯出的進度將會被覆蓋！`,
                            onConfirm: () => {
                                if (parsed.basicInfo) setBasicInfo(parsed.basicInfo);
                                if (parsed.examScopes) setExamScopes(parsed.examScopes);
                                if (parsed.questions) setQuestions(parsed.questions);
                                if (parsed.curriculumDB && Array.isArray(parsed.curriculumDB)) {
                                    setCurriculumDB(parsed.curriculumDB);
                                }
                                setConfirmDialog(null);
                                showToast("✅ 成功載入 JSON 擬題進度！");
                            }
                        });
                    } catch (err) {
                        showToast("JSON 檔案解析失敗，請確認檔案格式是否正確", true);
                    }
                };
                reader.readAsText(file);
                // 重設 input 讓同一個檔案可以重複選取
                e.target.value = '';
            };

            // 提取唯一選項的輔助函數
            const getUniqueOptions = (data, key, filters = {}) => {
                let filtered = data;
                Object.keys(filters).forEach(filterKey => {
                    if (filters[filterKey]) {
                        filtered = filtered.filter(item => item[filterKey] === filters[filterKey]);
                    }
                });
                return [...new Set(filtered.map(item => item[key]))].filter(Boolean);
            };

            // 動態計算目前可用的課題清單
            const availableTopics = useMemo(() => {
                if (!currentScopeParams.grade || !currentScopeParams.book) return [];
                return getUniqueOptions(curriculumDB, 'topic', {grade: currentScopeParams.grade, book: currentScopeParams.book});
            }, [curriculumDB, currentScopeParams.grade, currentScopeParams.book]);

            // 下載標準 Excel 範本
            const downloadTemplate = () => {
                const templateData = [
                    { "年級": "小五", "冊別": "5上A", "課次及課題": "1. 多位數", "教學目標": "認識過萬的數，包括十萬、百萬、千萬。" },
                    { "年級": "小五", "冊別": "5上A", "課次及課題": "1. 多位數", "教學目標": "讀出和寫出過萬的數。" }
                ];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "教學目標總表");
                XLSX.writeFile(wb, "教學目標總表範本.xlsx");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        
                        const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                        
                        let isFiveColFormat = false;
                        let headerRow = json[0] || [];
                        if (String(headerRow[4] || "").includes("目標") || String(headerRow[4] || "").includes("重點")) {
                            isFiveColFormat = true;
                        } else {
                            let col4DataCount = 0;
                            for (let r = 1; r < Math.min(20, json.length); r++) {
                                if (json[r] && String(json[r][4] || "").trim() !== "") col4DataCount++;
                            }
                            if (col4DataCount > 3) isFiveColFormat = true;
                        }

                        let parsedData = [];
                        let lastGrade = "", lastBook = "", lastChapter = "", lastTopicPart = "", lastCombinedTopic = "";
                        
                        for (let i = 1; i < json.length; i++) {
                            const row = json[i];
                            if (!row || row.length === 0 || row.join("").trim() === "") continue;
                            
                            let grade = String(row[0] || "").trim() !== "" ? String(row[0]).trim() : lastGrade;
                            let book = String(row[1] || "").trim() !== "" ? String(row[1]).trim() : lastBook;
                            
                            let topicStr = "";
                            let objective = "";
                            
                            if (isFiveColFormat) {
                                let chapter = String(row[2] || "").trim() !== "" ? String(row[2]).trim() : lastChapter;
                                let topicName = String(row[3] || "").trim() !== "" ? String(row[3]).trim() : (String(row[2] || "").trim() !== "" ? "" : lastTopicPart);
                                
                                if (chapter && topicName) {
                                    let sep = (chapter.endsWith(".") || chapter.endsWith(" ") || chapter.endsWith("、") || chapter.endsWith("-")) ? "" : " ";
                                    topicStr = `${chapter}${sep}${topicName}`;
                                } else if (chapter) {
                                    topicStr = chapter;
                                } else if (topicName) {
                                    topicStr = topicName;
                                } else {
                                    topicStr = lastCombinedTopic;
                                }
                                objective = String(row[4] || "").trim();
                                
                                lastChapter = chapter;
                                lastTopicPart = topicName;
                            } else {
                                topicStr = String(row[2] || "").trim() !== "" ? String(row[2]).trim() : lastCombinedTopic;
                                objective = String(row[3] || "").trim();
                            }

                            topicStr = topicStr.replace(/\r?\n/g, ' ');
                            objective = objective.replace(/\r?\n/g, ' ');
                            
                            if (objective !== "") {
                                let domainStr = '數';
                                if (topicStr.includes("形") || topicStr.includes("空間") || topicStr.includes("角") || topicStr.includes("方向")) domainStr = "圖形與空間";
                                else if (topicStr.includes("面積") || topicStr.includes("周界") || topicStr.includes("容量") || topicStr.includes("長度") || topicStr.includes("時間") || topicStr.includes("重量") || topicStr.includes("貨幣") || topicStr.includes("體積")) domainStr = "度量";
                                else if (topicStr.includes("圖") || topicStr.includes("數據") || topicStr.includes("平均") || topicStr.includes("象形")) domainStr = "數據處理";
                                else if (topicStr.includes("代數") || topicStr.includes("方程") || topicStr.includes("未知數")) domainStr = "代數";

                                parsedData.push({
                                    grade: grade,
                                    book: book,
                                    topic: topicStr,
                                    objective: objective,
                                    domain: domainStr
                                });
                            }
                            
                            lastGrade = grade;
                            lastBook = book;
                            lastCombinedTopic = topicStr;
                        }
                        
                        if (parsedData.length > 0) {
                            setCurriculumDB(parsedData);
                            showToast(`✅ 成功匯入 ${parsedData.length} 條教學目標資料！`);
                        } else {
                            showToast('匯入失敗：未能讀取到有效的教學目標資料。', true);
                        }
                    } catch (error) {
                        showToast('讀取 Excel 檔案發生錯誤。請確認格式正確。', true);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const addExamScope = () => {
                if (!currentScopeParams.grade || !currentScopeParams.book || selectedTopics.length === 0) {
                    showToast('⚠️ 請完整選擇年級、冊別，並勾選至少一個課題', true);
                    return;
                }
                
                const newScopes = [];
                selectedTopics.forEach((topic, index) => {
                    const exists = examScopes.some(s => s.grade === currentScopeParams.grade && s.book === currentScopeParams.book && s.topic === topic);
                    if (!exists) {
                        newScopes.push({ grade: currentScopeParams.grade, book: currentScopeParams.book, topic, id: Date.now() + index });
                    }
                });

                if (newScopes.length > 0) {
                    setExamScopes([...examScopes, ...newScopes]);
                    setSelectedTopics([]);
                    showToast(`✅ 成功加入 ${newScopes.length} 個課題範圍`);
                } else {
                    showToast('⚠️ 所選的課題已存在於考核範圍中', true);
                }
            };

            const removeExamScope = (id) => {
                setExamScopes(examScopes.filter(scope => scope.id !== id));
            };

            // 自動查找範疇
            useEffect(() => {
                if (currentQuestionParams.topic) {
                    const match = curriculumDB.find(item => 
                        item.grade === currentQuestionParams.grade && 
                        item.book === currentQuestionParams.book && 
                        item.topic === currentQuestionParams.topic
                    );
                    if (match) {
                        setCurrentQuestionParams(prev => ({ ...prev, domain: match.domain }));
                    }
                }
            }, [currentQuestionParams.topic, curriculumDB]);

            const addQuestion = () => {
                if (!currentQuestionParams.qNum || !currentQuestionParams.score) {
                    showToast('⚠️ 請輸入題號及佔分', true);
                    return;
                }

                const isInScope = examScopes.some(scope => 
                    scope.grade === currentQuestionParams.grade &&
                    scope.book === currentQuestionParams.book &&
                    scope.topic === currentQuestionParams.topic
                );
                const attribute = isInScope ? '本次範圍' : '已有知識';

                const newQuestion = { 
                    ...currentQuestionParams, 
                    score: Number(currentQuestionParams.score),
                    attribute: attribute,
                    id: Date.now() 
                };
                setQuestions([...questions, newQuestion]);
                
                setCurrentQuestionParams(prev => ({ ...prev, qNum: '', score: '' }));
            };

            const removeQuestion = (id) => {
                setQuestions(questions.filter(q => q.id !== id));
            };

            // 新增：編輯題目的相關函數
            const startEdit = (q) => {
                setEditingQuestionId(q.id);
                setEditFormData({ qNum: q.qNum, type: q.type, high: q.high, score: q.score });
            };

            const cancelEdit = () => {
                setEditingQuestionId(null);
                setEditFormData({ qNum: '', type: '', high: '', score: '' });
            };

            const saveEdit = () => {
                if (!editFormData.qNum || !editFormData.score) {
                    showToast('⚠️ 請輸入題號及佔分', true);
                    return;
                }
                setQuestions(questions.map(q => {
                    if (q.id === editingQuestionId) {
                        return { 
                            ...q, 
                            qNum: editFormData.qNum, 
                            type: editFormData.type, 
                            high: editFormData.high, 
                            score: Number(editFormData.score) 
                        };
                    }
                    return q;
                }));
                setEditingQuestionId(null);
                showToast('✅ 題目資料已更新');
            };

            const stats = useMemo(() => {
                let total = 0;
                let higherOrder = 0;
                let domainScores = {};
                let typeScores = {};
                let attributeScores = { '本次範圍': 0, '已有知識': 0 };

                questions.forEach(q => {
                    total += q.score;
                    if (q.high === '是') higherOrder += q.score;
                    
                    domainScores[q.domain] = (domainScores[q.domain] || 0) + q.score;
                    typeScores[q.type] = (typeScores[q.type] || 0) + q.score;
                    attributeScores[q.attribute] = (attributeScores[q.attribute] || 0) + q.score;
                });

                return { total, higherOrder, domainScores, typeScores, attributeScores };
            }, [questions]);

            const exportToWord = () => {
                const headerHTML = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head>
                        <meta charset="utf-8">
                        <style>
                            /* 全卷字型與字體大小、行距設定 */
                            body { font-family: '標楷體', 'DFKai-SB', 'BiauKai', serif; font-size: 12pt; line-height: 1.0; }
                            p { margin: 0; padding: 0; line-height: 1.0; margin-bottom: 5px; }
                            h3 { font-size: 12pt; margin-top: 15px; margin-bottom: 5px; text-align: left; font-weight: bold; }
                            
                            /* 資料表格設定 */
                            table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
                            table.data-table th, table.data-table td { border: 1px solid black; padding: 5px; text-align: left; font-size: 12pt; line-height: 1.0; }
                            table.data-table th { background-color: #f2f2f2; }
                            
                            /* 頂部排版專用無邊框表格 */
                            table.layout-table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; border: none; }
                            table.layout-table td { border: none; padding: 0; font-size: 12pt; line-height: 1.0; }
                        </style>
                    </head>
                    <body>
                `;

                const basicInfoHTML = `
                    <div style="text-align: center; margin-bottom: 5px;">${basicInfo.schoolName || '（學校名稱未填寫）'}</div>
                    <div style="text-align: center; margin-bottom: 15px;">${basicInfo.year} 數學科擬題表（${basicInfo.examStage}）</div>
                    
                    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="width: 100%; border-collapse: collapse; border: none; margin-bottom: 20px;">
                        <tr>
                            <td style="text-align: left; width: 33.33%; border: none; padding: 0; font-size: 12pt; line-height: 1.0;">${basicInfo.targetGrade}</td>
                            <td style="text-align: center; width: 33.33%; border: none; padding: 0; font-size: 12pt; line-height: 1.0;">科任老師：${basicInfo.subjectTeacher}</td>
                            <td style="text-align: right; width: 33.33%; border: none; padding: 0; font-size: 12pt; line-height: 1.0;">擬題老師：${basicInfo.setter}</td>
                        </tr>
                    </table>
                `;

                const scopeHTML = `
                    <h3>《考核範圍列表》</h3>
                    <table class="data-table">
                        <tr><th>年級</th><th>冊別</th><th>課次及課題</th></tr>
                        ${examScopes.map(s => `<tr><td>${s.grade}</td><td>${s.book}</td><td>${s.topic}</td></tr>`).join('')}
                    </table>
                `;

                const questionHTML = `
                    <h3>《題目分佈表》</h3>
                    <table class="data-table">
                        <tr>
                            <th>題號</th><th>題型</th><th>年級</th><th>冊別</th><th>課次及課題</th>
                            <th>範疇</th><th>教學目標</th><th>高階題</th><th>佔分</th><th>屬性</th>
                        </tr>
                        ${questions.map(q => `
                            <tr>
                                <td>${q.qNum}</td><td>${q.type}</td><td>${q.grade}</td>
                                <td>${q.book}</td><td>${q.topic}</td><td>${q.domain}</td>
                                <td>${q.objective}</td><td>${q.high}</td><td>${q.score}</td>
                                <td>${q.attribute}</td>
                            </tr>
                        `).join('')}
                    </table>
                `;

                const summaryHTML = `
                    <h3>總計</h3>
                    <p><strong>A. 全卷總分：</strong> ${stats.total}</p>
                    <p><strong>B. 高階題總分：</strong> ${stats.higherOrder}</p>
                    
                    <p><strong>C. 各範疇佔分：</strong></p>
                    <ul>${Object.entries(stats.domainScores).map(([k,v]) => `<li style="line-height: 1.0; margin-bottom: 2px;">${k}: ${v}分</li>`).join('')}</ul>
                    
                    <p><strong>D. 各題型佔分：</strong></p>
                    <ul>${Object.entries(stats.typeScores).map(([k,v]) => `<li style="line-height: 1.0; margin-bottom: 2px;">${k}: ${v}分</li>`).join('')}</ul>
                    
                    <p><strong>E. 各屬性佔分：</strong></p>
                    <ul>${Object.entries(stats.attributeScores).map(([k,v]) => `<li style="line-height: 1.0; margin-bottom: 2px;">${k}: ${v}分</li>`).join('')}</ul>
                `;

                const footerHTML = `</body></html>`;
                const fullHTML = headerHTML + basicInfoHTML + scopeHTML + questionHTML + summaryHTML + footerHTML;

                const blob = new Blob(['\ufeff', fullHTML], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `數學科擬題表_${basicInfo.targetGrade}_${basicInfo.examStage}.doc`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="h-full w-full flex flex-col bg-gray-50 overflow-hidden relative text-gray-800">
                    {/* Toast 提示訊息 */}
                    {toastMessage && (
                        <div className={`fixed top-5 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-lg font-bold text-sm toast-animate flex items-center gap-2 ${toastMessage.isError ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`}>

                                                            </td>
                                                            <td className="px-2 py-2 border-r">
                                                                <input type="number" min="1" value={editFormData.score} onChange={e => setEditFormData({...editFormData, score: e.target.value})} className="w-full p-1.5 border border-indigo-300 rounded text-sm text-center font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                            </td>
                                                            <td className="px-3 py-2 text-center border-r opacity-60">
                                                                <span className={`inline-block px-2 py-1 rounded text-xs font-medium ${q.attribute === '本次範圍' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-600'}`}>
                                                                    {q.attribute}
                                                                </span>
                                                            </td>
                                                            <td className="px-2 py-2 text-center">
                                                                <div className="flex flex-col gap-1.5">
                                                                    <button onClick={saveEdit} className="text-white bg-green-500 hover:bg-green-600 px-2 py-1 rounded text-xs font-bold shadow-sm transition-colors">儲存</button>
                                                                    <button onClick={cancelEdit} className="text-gray-700 bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-xs font-medium shadow-sm transition-colors">取消</button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        <tr key={q.id} className="hover:bg-indigo-50/40 transition-colors">
                                                            <td className="px-3 py-2 text-center font-black text-gray-800 border-r">{q.qNum}</td>
                                                            <td className="px-3 py-2 text-gray-600 border-r">{q.type}</td>
                                                            <td className="px-3 py-2 border-r">
                                                                <span className="text-xs text-indigo-500 font-medium block">{q.grade} {q.book}</span>
                                                                <span className="text-gray-800">{q.topic || '-'}</span>
                                                            </td>
                                                            <td className="px-3 py-2 text-gray-700 text-xs border-r whitespace-normal break-words">{q.objective || '-'}</td>
                                                            <td className="px-2 py-2 text-center border-r">{q.high === '是' ? <span className="text-amber-600 font-bold">✅</span> : '-'}</td>
                                                            <td className="px-2 py-2 text-center font-bold text-indigo-700 text-base border-r">{q.score}</td>
                                                            <td className="px-3 py-2 text-center border-r">
                                                                <span className={`inline-block px-2 py-1 rounded text-xs font-medium ${q.attribute === '本次範圍' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-600'}`}>
                                                                    {q.attribute}
                                                                </span>
                                                            </td>
                                                            <td className="px-2 py-2 text-center">
                                                                <div className="flex justify-center gap-1.5 flex-wrap">
                                                                    <button onClick={() => startEdit(q)} className="text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded transition-colors text-xs font-bold">編輯</button>
                                                                    <button onClick={() => removeQuestion(q.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition-colors text-xs font-bold">刪除</button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 右側：統計面板 (大螢幕永遠固定，小螢幕滑出) */}
                        {/* 黑色遮罩 (僅小螢幕有效) */}
                        {isSidebarOpen && (
                            <div className="fixed inset-0 bg-black/40 z-40 lg:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsSidebarOpen(false)}></div>
                        )}
                        
                        <aside className={`
                            fixed lg:static top-0 right-0 h-full z-50 bg-white lg:bg-gray-50
                            w-[320px] xl:w-[360px] shrink-0 border-l border-gray-200
                            transform transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none
                            flex flex-col
                            ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}
                        `}>
                            {/* 手機版面板標題列 */}
                            <div className="lg:hidden flex justify-between items-center p-4 border-b border-gray-200 bg-white shrink-0">
                                <h2 className="text-lg font-bold text-gray-800">第四部份：總計</h2>
                                <button onClick={() => setIsSidebarOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-600 hover:bg-gray-200">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                            
                            {/* 統計內容區 (獨立滾動) */}
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-6 w-full pb-28 lg:pb-6">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col gap-5 h-auto min-h-full">
                                    <h2 className="hidden lg:block text-lg font-bold text-gray-800 border-b pb-3">第四部份：總計</h2>
                                    
                                    {/* 核心雙數據 */}
                                    <div className="flex gap-3">
                                        <div className="flex-1 bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-xl border border-blue-200 text-center shadow-inner">
                                            <div className="text-xs text-blue-700 font-bold mb-1">A. 全卷總分</div>
                                            <div className="text-3xl font-black text-blue-900">{stats.total}</div>
                                        </div>
                                        <div className="flex-1 bg-gradient-to-br from-purple-50 to-purple-100 p-4 rounded-xl border border-purple-200 text-center shadow-inner">
                                            <div className="text-xs text-purple-700 font-bold mb-1">B. 高階總分</div>
                                            <div className="text-3xl font-black text-purple-900">{stats.higherOrder}</div>
                                        </div>
                                    </div>

                                    {/* 詳細分析列表 */}
                                    <div className="space-y-4">
                                        <div className="border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                                            <h3 className="font-bold text-gray-700 bg-gray-50 px-3 py-2.5 text-sm border-b">C. 各範疇佔分</h3>
                                            <ul className="p-2 space-y-1">
                                                {Object.entries(stats.domainScores).map(([k,v]) => (
                                                    <li key={k} className="flex justify-between items-center text-sm p-1.5 hover:bg-gray-50 rounded">
                                                        <span className="text-gray-600">{k || '未分類'}</span>
                                                        <span className="font-bold bg-gray-100 text-gray-800 px-2 py-0.5 rounded shadow-sm">{v} 分</span>
                                                    </li>
                                                ))}
                                                {Object.keys(stats.domainScores).length === 0 && <li className="text-sm text-gray-400 p-2 text-center">暫無數據</li>}
                                            </ul>
                                        </div>
                                        
                                        <div className="border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                                            <h3 className="font-bold text-gray-700 bg-gray-50 px-3 py-2.5 text-sm border-b">D. 各題型佔分</h3>
                                            <ul className="p-2 space-y-1">
                                                {Object.entries(stats.typeScores).map(([k,v]) => (
                                                    <li key={k} className="flex justify-between items-center text-sm p-1.5 hover:bg-gray-50 rounded">
                                                        <span className="text-gray-600 truncate max-w-[150px]" title={k}>{k}</span>
                                                        <span className="font-bold bg-gray-100 text-gray-800 px-2 py-0.5 rounded shadow-sm">{v} 分</span>
                                                    </li>
                                                ))}
                                                {Object.keys(stats.typeScores).length === 0 && <li className="text-sm text-gray-400 p-2 text-center">暫無數據</li>}
                                            </ul>
                                        </div>
                                        
                                        <div className="border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                                            <h3 className="font-bold text-gray-700 bg-gray-50 px-3 py-2.5 text-sm border-b">E. 各屬性佔分</h3>
                                            <ul className="p-2 space-y-1">
                                                {Object.entries(stats.attributeScores).map(([k,v]) => (
                                                    <li key={k} className="flex justify-between items-center text-sm p-1.5 hover:bg-gray-50 rounded">
                                                        <span className={`text-xs px-2 py-1 rounded font-medium ${k==='本次範圍'?'bg-blue-50 text-blue-700':'bg-amber-50 text-amber-700'}`}>{k}</span>
                                                        <span className="font-bold bg-gray-100 text-gray-800 px-2 py-0.5 rounded shadow-sm">{v} 分</span>
                                                    </li>
                                                ))}
                                                {Object.keys(stats.attributeScores).length === 0 && <li className="text-sm text-gray-400 p-2 text-center">暫無數據</li>}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </main>

                    {/* 固定在最底部的匯出按鈕列 */}
                    <footer className="shrink-0 bg-white border-t border-gray-200 p-3 sm:p-4 z-20 flex justify-center shadow-[0_-4px_10px_rgba(0,0,0,0.04)] relative">
                        <button onClick={exportToWord} className="flex items-center justify-center gap-2 bg-[#2b579a] text-white px-8 py-3.5 rounded-xl hover:bg-[#1f4279] font-bold text-lg shadow-lg transition-transform hover:-translate-y-0.5 w-full sm:w-auto min-w-[320px]">
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM17 19H7v-2h10v2zm0-4H7v-2h10v2z"/></svg>
                            匯出為 Word 檔案 (DOC)
                        </button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
